apply plugin: 'com.android.application'

/*
 * Release signing comes from the environment, which CI fills in from repository
 * secrets. The same key has to sign every build: Android refuses to install an APK
 * over one signed by a different key, and uninstalling first would throw away every
 * expense stored on the device.
 *
 * The keystore is PKCS#12 rather than JKS, because it is generated by
 * scripts/gen-keystore.mjs with node-forge — there is no JDK on the machine this app
 * is developed on, so no keytool either.
 *
 * With no keystore present the release build still runs and simply comes out
 * unsigned, so a fork or a local check does not need the secrets.
 */
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreAlias = System.getenv('ANDROID_KEY_ALIAS')
def hasSigningKey = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

// Version comes from the tag that triggered the build; the code has to rise with
// every release or Android treats the new APK as a downgrade and blocks it.
def buildVersionName = System.getenv('SPEND_VERSION_NAME') ?: '1.0.0'
def buildVersionCode = (System.getenv('SPEND_VERSION_CODE') ?: '1') as Integer

android {
    namespace = "io.github.paskaeu25.spend"
    compileSdk = rootProject.ext.compileSdkVersion

    if (hasSigningKey) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                // One password protects both the store and the key inside it.
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword
                storeType 'PKCS12'
            }
        }
    }

    defaultConfig {
        applicationId "io.github.paskaeu25.spend"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
