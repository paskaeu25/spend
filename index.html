<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <meta name="description" content="Track spending by hand. Offline, on your device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Spend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pin the theme before first paint, so a dark-mode launch never flashes light.
      try {
        var pref = JSON.parse(localStorage.getItem('et.settings') || '{}').theme || 'system'
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
